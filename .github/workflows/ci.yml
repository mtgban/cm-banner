name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: bun install
        run: bun install --frozen-lockfile

      - name: bun test
        run: bun test tests/

      # The manifest is what the browsers read; a typo in it is a broken
      # install rather than a failing test, so it is parsed here.
      - name: manifest is valid json
        run: python3 -c "import json; json.load(open('manifest.json'))"
