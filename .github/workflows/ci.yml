name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: bun install
        run: bun install --frozen-lockfile

      - name: bun test
        run: bun run test

      # A manifest is what the browsers read; a typo in it is a broken
      # install rather than a failing test, so each site's is checked here -
      # both that it parses and that every file it names is actually present.
      - name: manifests name only files that exist
        run: |
          python3 - <<'EOF'
          import glob, json, os, sys
          paths = sorted(glob.glob("sites/*/manifest.json"))
          if not paths:
              sys.exit("no sites/*/manifest.json")
          for path in paths:
              site = os.path.dirname(path)
              m = json.load(open(path))
              named = list(m.get("icons", {}).values())
              for cs in m.get("content_scripts", []):
                  named += cs.get("js", []) + cs.get("css", [])
              missing = [f for f in named if not os.path.exists(os.path.join(site, f))]
              if missing:
                  sys.exit(path + " names missing files: " + ", ".join(missing))
              print(f"{path} names {len(named)} files, all present")
          EOF
